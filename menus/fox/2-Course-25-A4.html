<style>
:root {
  --rust: #8B3A1F;
  --rust-dark: #6B2A15;
  --forest: #2D4A2B;
  --charcoal: #1A1A1A;
  --grey: #5A5A5A;
  --grey-light: #8A8A8A;
  --cream: #FBF8F3;
  --rule: #D4C9B8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #E8E4DB;
  color: var(--charcoal);
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---------- A4 page container ---------- */
.menu-page {
  width: 210mm;
  min-height: 297mm;
  margin: 20px auto;
  padding: 10mm 14mm 11mm;
  background: transparent;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Decorative corner marks */
.menu-page::before,
.menu-page::after {
  content: '';
  position: absolute;
  width: 15mm;
  height: 15mm;
  border: 1px solid var(--rust);
  opacity: 0.25;
  pointer-events: none;
}
.menu-page::before {
  top: 8mm; left: 8mm;
  border-right: none; border-bottom: none;
}
.menu-page::after {
  bottom: 8mm; right: 8mm;
  border-left: none; border-top: none;
}

.page-header, .menu-body, .page-footer {
  position: relative;
  z-index: 1;
}

/* ========== HEADER ========== */
.page-header {
  text-align: center;
  padding-bottom: 3mm;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 3mm;
}

.header-flourish-top {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-size: 10pt;
  letter-spacing: 0.5em;
  color: var(--rust);
  font-weight: 500;
  margin-bottom: 2mm;
}

.fox-logo {
  display: block;
  margin: 0 auto -1.5mm;
  width: 26mm;
  height: auto;
}

.wordmark {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-weight: 700;
  font-size: 44pt;
  letter-spacing: 0.14em;
  color: var(--charcoal);
  line-height: 1;
  margin-bottom: 2.5mm;
}

.location {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-weight: 500;
  font-size: 11pt;
  letter-spacing: 0.4em;
  color: var(--grey);
  margin-bottom: 3mm;
}

.subtitle {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-weight: 600;
  font-size: 13pt;
  letter-spacing: 0.4em;
  color: var(--rust);
  margin-top: 1mm;
}

/* ---------- Offer line ---------- */
.offer {
  text-align: center;
  margin-bottom: 2mm;
}

.offer-headline {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 15pt;
  color: var(--forest);
}

.offer-headline .dash {
  font-style: normal;
  color: var(--grey-light);
  margin: 0 6px;
}

.offer-headline .num {
  font-style: normal;
  font-weight: 700;
  font-size: 16pt;
  color: var(--rust);
  font-variant-numeric: tabular-nums;
}

.offer-terms {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-size: 9pt;
  letter-spacing: 0.14em;
  color: var(--grey);
  margin-top: 1.5mm;
}

/* ========== MENU BODY ========== */
.menu-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
}

.section { padding: 2mm 0; }

.section-heading {
  text-align: center;
  margin-bottom: 4mm;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8mm;
}

.section-heading::before,
.section-heading::after {
  content: '';
  flex: 1;
  max-width: 60mm;
  height: 1px;
  background: var(--rust);
  opacity: 0.3;
}

.section-heading h2 {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-weight: 600;
  font-size: 15pt;
  letter-spacing: 0.45em;
  color: var(--rust);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ---------- Dishes — single centred column ---------- */
.dishes-one-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.dish {
  text-align: center;
  margin-bottom: 3.5mm;
}
.dish:last-child { margin-bottom: 0; }

.dish-name {
  display: block;
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-weight: 600;
  font-size: 13pt;
  color: var(--charcoal);
  letter-spacing: 0.01em;
  margin-bottom: 1.2mm;
}

.dish-desc {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-style: italic;
  font-weight: 400;
  font-size: 10.5pt;
  color: var(--grey);
  line-height: 1.4;
  max-width: 125mm;
  margin: 0 auto;
}

/* ========== FOOTER ========== */
.page-footer {
  margin-top: 2mm;
  padding-top: 2mm;
  border-top: 1px solid var(--rule);
  text-align: center;
}

.footer-allergy {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-style: italic;
  font-size: 9.5pt;
  color: var(--grey);
  margin-bottom: 1.5mm;
  max-width: 150mm;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.35;
}

.footer-contact {
  font-family: "Liberation Serif", "Times New Roman", Times, serif;
  font-size: 8pt;
  letter-spacing: 0.2em;
  color: var(--forest);
  font-weight: 500;
  line-height: 1.4;
}

.footer-contact .sep {
  margin: 0 8px;
  color: var(--grey-light);
  font-weight: 400;
}

/* ========== Print ========== */
@media print {
  @page {
    size: 210mm 297mm portrait;
    margin: 0;
  }
  html, body { background: transparent; }
  .menu-page {
    margin: 0;
    box-shadow: none;
    width: 210mm;
    min-height: 297mm;
    background: transparent;
  }
}
</style>
</head>

<script>
function renderDish(dish) {

}
